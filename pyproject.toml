[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ownbox"
dynamic = ["version"]
description = "Find, install, and update your own tools from GitHub."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Bogdan Stamenovic" }]
keywords = ["github", "developer-tools", "project-manager", "bootstrap"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
]
dependencies = [
  "PyYAML>=6.0.2,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<10",
  "pytest-cov>=5.0,<7",
  "ruff>=0.6,<1",
  "mypy>=1.11,<3",
]

[project.scripts]
ownbox = "ownbox.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ownbox"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.version]
# Single source of truth: keep the version in the package, so packaging
# metadata and 'ownbox --version' can never drift apart.
path = "src/ownbox/__init__.py"

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = "yaml"
ignore_missing_imports = true
