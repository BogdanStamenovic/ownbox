[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ownbox"
version = "0.2.0"
description = "Find, install, and update your own tools from GitHub."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Bogdan Stamenovic" }]
keywords = ["github", "developer-tools", "project-manager", "bootstrap"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
]
dependencies = [
  "PyYAML>=6.0.2,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
ownbox = "ownbox.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ownbox"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
