schema: 1
name: example-tool
description: One sentence explaining what the tool does.
homepage: https://github.com/your-name/example-tool
tags:
  - cli
  - raspberry-pi
install:
  platforms:
    - linux
    - darwin
    - windows
  setup:
    linux:
      - python -m venv .venv
      - .venv/bin/python -m pip install -e .
    darwin:
      - python -m venv .venv
      - .venv/bin/python -m pip install -e .
    windows:
      - python -m venv .venv
      - '.venv\Scripts\python.exe -m pip install -e .'
  update:
    linux: [.venv/bin/python -m pip install -e .]
    darwin: [.venv/bin/python -m pip install -e .]
    windows: ['.venv\Scripts\python.exe -m pip install -e .']
  # Optional commands that clean up app-owned state before Ownbox deletes the checkout.
  remove: []
command:
  linux: .venv/bin/python -m example_tool
  darwin: .venv/bin/python -m example_tool
  windows: '.venv\Scripts\python.exe -m example_tool'
